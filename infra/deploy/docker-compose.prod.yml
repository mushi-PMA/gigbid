# Production override: one public HTTPS entry point (Caddy, automatic Let's Encrypt certificate).
#   docker compose -f infra/docker-compose.yml -f infra/deploy/docker-compose.prod.yml --env-file .env up -d --build
# https://SITE_HOST/            web app
# https://SITE_HOST/api/        API (also the Upwork OAuth callback)
# https://SITE_HOST/phoenix/    traces (public read-only links in the README)
services:
  caddy:
    image: caddy:2.10.2-alpine
    ports: ["80:80", "443:443"]
    environment:
      SITE_HOST: ${SITE_HOST:?set SITE_HOST in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro    # paths resolve from infra/, the first compose file
      - caddydata:/data
    depends_on: [web, api, phoenix]
    restart: unless-stopped

  ollama:                      # the deployed open profile uses hosted endpoints; local models only on request
    profiles: ["local-models"]

  web:
    ports: !reset []
  api:
    ports: !reset []
    environment:
      APP_ENV: production
  phoenix:
    ports: !reset []
    environment:
      PHOENIX_HOST_ROOT_PATH: /phoenix
      # login on: graders use a read-only viewer account; the services send traces with the admin secret
      PHOENIX_ENABLE_AUTH: "true"
      PHOENIX_SECRET: ${PHOENIX_SECRET:?set PHOENIX_SECRET in .env}
      PHOENIX_ADMIN_SECRET: ${PHOENIX_ADMIN_SECRET:?set PHOENIX_ADMIN_SECRET in .env}
      PHOENIX_DEFAULT_ADMIN_INITIAL_PASSWORD: ${PHOENIX_ADMIN_PASSWORD:?set PHOENIX_ADMIN_PASSWORD in .env}

volumes:
  caddydata: {}
