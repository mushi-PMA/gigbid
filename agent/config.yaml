# GigBid configuration. Every model, rule, budget and threshold lives here, never in code.
# Override the file with GIGBID_CONFIG=/path/to/other.yaml; override single values with env vars where noted.

marketplace:
  mode: gigsim                 # gigsim | upwork_live   (env MARKETPLACE_MODE overrides)
  gigsim_base_url: http://localhost:8081
  max_requests_per_minute: 40  # stays under GigSim's 60/min
  upwork:
    mcp_url: https://mcp.upwork.com/mcp
    # Upwork MCP tool names mapped onto our port. Filled from the server's tool list at connect time; the
    # names below are the defaults we expect and can be changed without touching code.
    tool_map:
      search_jobs: search_jobs
      get_job: get_job_details
      get_client_history: get_client_info
      get_connects_balance: get_connects_balance
      list_messages: list_messages
      create_proposal_draft: create_proposal_draft
      submit_proposal: submit_proposal
      send_message: send_message
    min_poll_minutes: 120      # live scouting interval floor (see docs/RUNBOOK.md)

models:
  profile: open                # open | open_gemma | open_local   (env MODEL_PROFILE overrides)
  # Hosted open-weight endpoints (OpenAI-compatible). Each lists the models it serves by size name. A "pool" profile
  # sends each call to the next endpoint that serves the size and has its key set; one that hits a rate limit rests
  # until its retry-after passes, so several free tiers add up. All endpoints for a size serve the SAME weights.
  endpoints:
    - name: groq
      base_url: https://api.groq.com/openai/v1
      api_key_env: GROQ_API_KEY
      models: {small: openai/gpt-oss-20b, large: openai/gpt-oss-120b}
      extra_body: {reasoning_effort: low}     # gpt-oss: short hidden reasoning (cheaper, faster)
    - name: nvidia
      base_url: https://integrate.api.nvidia.com/v1
      api_key_env: NVIDIA_API_KEY
      models: {small: openai/gpt-oss-20b, large: openai/gpt-oss-120b}
    - name: cerebras
      base_url: https://api.cerebras.ai/v1
      api_key_env: CEREBRAS_API_KEY
      models: {large: gpt-oss-120b}
      extra_body: {reasoning_effort: low}
    - name: sambanova
      base_url: https://api.sambanova.ai/v1
      api_key_env: SAMBANOVA_API_KEY
      models: {large: gpt-oss-120b}
    - name: cloudflare          # Workers AI; {CLOUDFLARE_ACCOUNT_ID} is filled from the environment
      base_url: https://api.cloudflare.com/client/v4/accounts/{CLOUDFLARE_ACCOUNT_ID}/ai/v1
      api_key_env: CLOUDFLARE_API_TOKEN
      models: {small: "@cf/openai/gpt-oss-20b", large: "@cf/openai/gpt-oss-120b"}
    - name: gemini
      base_url: https://generativelanguage.googleapis.com/v1beta/openai
      api_key_env: GEMINI_API_KEY
      models: {gemma_small: gemma-4-31b-it, gemma_large: gemma-4-31b-it}   # 26B-A4B returned 500 on every call (15 Nov)
  profiles:
    open:                       # deployed profile: gpt-oss-20b for cheap, frequent nodes; gpt-oss-120b where quality matters
      provider: pool
      nodes:
        scout: small
        analyst: small
        risk_assessor: small
        fit_matcher: small
        pricing: small
        writer: large
        verifier: small
        critic: large
        compliance: small
        client_liaison: large
        intent: small
        rag_helper: small       # HyDE, decomposition, contextual lines, evidence grading
        judge: large
        gigsim_client: large
        tool_agent: large       # R&D question A and the single-agent baselines
      fallback: large           # a cheap node whose model keeps failing moves up to the large model
    open_gemma:                 # second open configuration compared on the dev set (evals/runners/model_comparison.py)
      provider: pool
      nodes:
        scout: gemma_small
        analyst: gemma_small
        risk_assessor: gemma_small
        fit_matcher: gemma_small
        pricing: gemma_small
        writer: gemma_large
        verifier: gemma_small
        critic: gemma_large
        compliance: gemma_small
        client_liaison: gemma_large
        intent: gemma_small
        rag_helper: gemma_small
        judge: large            # the judge stays fixed so scores are comparable
        gigsim_client: large    # the simulated clients stay fixed too
        tool_agent: gemma_large
    open_local:                 # same roles on local open models through Ollama (docker compose service "ollama")
      provider: openai_compatible
      base_url: http://ollama:11434/v1      # env OPENAI_BASE_URL overrides
      nodes:
        scout: qwen3:4b
        analyst: qwen3:4b
        risk_assessor: qwen3:4b
        fit_matcher: qwen3:4b
        pricing: qwen3:4b
        writer: qwen3:8b
        verifier: qwen3:4b
        critic: qwen3:8b
        compliance: qwen3:4b
        client_liaison: qwen3:8b
        intent: qwen3:4b
        rag_helper: qwen3:4b
        judge: qwen3:8b
        gigsim_client: qwen3:8b
        tool_agent: qwen3:8b
      fallback: qwen3:4b
  # USD per million tokens (input, output). We run on free tiers (actual bill US$0), so cost is reported at Groq's
  # on-demand list price (Nov 2026) for the same weights, which is what the system would cost at scale. Gemma 4 has
  # no paid list price on the Gemini API; it is reported at US$0 with that caveat. Keys ignore provider prefixes.
  prices:
    gpt-oss-20b: [0.075, 0.30]
    gpt-oss-120b: [0.15, 0.60]
  max_output_tokens: 1800
  timeout_seconds: 90
  retries: 3
  pool_wait_seconds: 600        # how long a pool call keeps waiting for a rate-limited endpoint before giving up
  fallback_after_seconds: 30    # a frequent node whose model rests longer (e.g. a daily quota) uses the fallback model
  cache_tag: effort-low         # part of the evaluation cache key; change it when request settings change
embeddings:
  model: BAAI/bge-small-en-v1.5        # open, CPU (fastembed / ONNX)
  reranker: Xenova/ms-marco-MiniLM-L-6-v2
  dim: 384

rag:
  variant: v2_v4                        # chosen on the dev set (evals/results/rag_variants_*.json); see docs/adr/0003-rag-variant.md
  top_k: 8
  chunk_tokens: 220
  chunk_overlap: 40

budgets:
  max_graph_steps: 40
  max_revisions: 2
  max_tokens_per_job: 60000
  max_tokens_per_conversation_turn: 15000
  node_timeout_seconds: 240
  declared:                              # declared before the hidden test run (R8, E5)
    p95_latency_seconds_per_job_analysed: 20
    p95_latency_seconds_per_proposal: 90
    usd_per_job_analysed: 0.002
    usd_per_proposal: 0.01

writer:
  # Proposal strategy (signature extension X2, A/B tested in evals/runners/x2_ab_test.py):
  #   writer          = A: open with the client's problem, then the most relevant evidence
  #   writer_strategy_b = B: open with a short credentials summary, then a step-by-step plan
  strategy: writer

thresholds:
  bid_min_fit: 0.55
  watch_min_fit: 0.40
  max_risk: 0.60
  min_client_quality: 0.20
  critic_min_personalisation: 0.6

platform:
  policy_file: data/policy_pack/policy.yaml   # rules the Compliance Guard and Pricing read

mcp:
  servers:                      # URLs can be overridden with <NAME>_MCP_URL env vars
    portfolio: http://localhost:8101/mcp
    marketplace: http://localhost:8102/mcp
    workspace: http://localhost:8103/mcp
  timeout_seconds: 30
  retries: 3
  # Each agent sees only these tools (filtered by name). Analyst and Compliance Guard use no tools.
  allowlists:
    scout: [search_jobs, get_job]
    analyst: []
    risk_assessor: [get_client_history]
    fit_matcher: [search_evidence]
    pricing: [get_market_pricing, get_connects_balance, get_policy]
    writer: [search_evidence, get_case_study]
    critic: [search_evidence]
    compliance: []
    submitter: [create_proposal_draft, submit_proposal, list_proposals]
    client_liaison: [list_threads, list_messages, send_message, search_evidence, get_free_slots,
                     create_interview_hold, create_email_draft]
    tracker: [list_events, list_proposals, get_connects_balance]
