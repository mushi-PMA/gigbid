name: publish-portfolio-mcp

# Publishes the Portfolio MCP server image so anyone can run it with one docker command (see
# mcp_servers/portfolio/README.md). The uvx install works straight from the repository and needs no publishing.

on:
  push:
    branches: [main]
    paths: ["mcp_servers/portfolio/**", "rag/**", "common/**", "agent/config.yaml", "pyproject.toml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Image names must be lowercase
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/mcp-portfolio.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/gigbid-portfolio-mcp:latest
            ghcr.io/${{ env.OWNER }}/gigbid-portfolio-mcp:${{ github.sha }}
