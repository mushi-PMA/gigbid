name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: lint, rules, unit, contract and integration tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install uv==0.13.8
          uv pip install --system -r pyproject.toml --extra dev
      - name: Cache open embedding models
        uses: actions/cache@v4
        with:
          path: ~/.cache/fastembed
          key: fastembed-${{ hashFiles('agent/config.yaml') }}
      - name: Lint
        run: ruff check .
      - name: Repository rules (no secrets, gigsim unchanged, prompts in agent/prompts, results in sync)
        run: python -m scripts.check_rules
      - name: Tests (offline, no API key)
        env:
          FASTEMBED_CACHE_PATH: ~/.cache/fastembed
        run: python -m pytest -q

  secrets:
    name: secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  web:
    name: web build and Playwright
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Typed API client is up to date with the FastAPI schema
        run: npm run gen:api && git diff --exit-code src/lib/api/schema.d.ts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: apps/web/playwright-report
