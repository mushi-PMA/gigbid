# Marketplace rules the Compliance Guard, the Pricing Strategist and the Risk Assessor read at run time.
# Changing platform rules means editing this file, not code. Text version: marketplace_policy.md.
version: v2
effective_from: "2026-11-02T00:00:00Z"

rules:
  - id: off_platform
    text: No off-platform contact or payment. Do not share or ask for emails, phone numbers, messaging apps
      (WhatsApp, Telegram, Skype, Discord) or payment outside the platform.
    action: redact            # redact | block | rewrite
    patterns:
      - '[\w.+-]+@[\w-]+\.[\w.-]+'
      - '(?<!\w)\+?\d[\d\s().-]{7,}\d'
      - '(?i)\b(whats\s?app|telegram|skype|discord|signal app|wechat)\b'
      - '(?i)\b(paypal|payoneer|wise transfer|bank transfer|western union|crypto|usdt|bitcoin)\b'
  - id: no_fabrication
    text: Never claim experience, clients, results, credentials or years of experience that the portfolio does not
      support.
    action: rewrite
  - id: no_guarantees
    text: Do not guarantee outcomes (rankings, revenue, accuracy, deadlines that depend on the client).
    action: rewrite
    patterns:
      - '(?i)\bguarantee[sd]?\b'
      - '(?i)\b100\s?% (accuracy|satisfaction|success|results?)\b'
      - '(?i)\b(promise|ensure) (you|that you) (will )?(get|rank|earn|double)\b'
  - id: no_free_work
    text: Do not offer or accept unpaid work disguised as a test or trial.
    action: block
    patterns:
      - '(?i)\b(free (sample|trial|test)|for free|unpaid (test|trial))\b'
  - id: no_external_links
    text: Cover letters, screening answers and messages must not contain links (http, https or www).
    action: redact
    patterns:
      - '(?i)(https?://\S+|www\.\S+)'
  - id: human_approval
    text: Nothing is submitted, sent or paid for (Connects) without explicit human approval, and live sends are
      confirmed again on the platform.
    action: block

connects:
  # Cost of a proposal = the job's listed Connects cost + surcharges below.
  surcharges:
    - {name: premium_job, payment_type: fixed, min_budget: 1000, extra: 4}
    - {name: premium_job, payment_type: hourly, min_budget: 50, extra: 4}

risk:
  # Phrases that signal scams or abuse in job posts and client messages (Risk Assessor, intent classifier).
  scam_signals:
    - '(?i)\b(unpaid|free) (test|trial|sample)\b'
    - '(?i)\b(contact|message|text) me (on|via) (whats\s?app|telegram|skype|discord)\b'
    - '(?i)\bpay(ment)? (outside|off) (the )?(platform|upwork|gigsim)\b'
    - '(?i)\b(send|share) (your )?(bank|card|id|passport|login) (details|number)\b'
    - '(?i)\b(registration|training|equipment) fee\b'
    # added after the dev failure analysis (docs/FAILURES.md, row 12): pay too good for the effort, all work before
    # escrow, equipment-cheque fraud, CV harvesting, pressure to act now, credential phishing
    - '(?i)\bearn \$\s?\d[\d,]*\b.{0,60}\bno (prior )?experience\b'
    - '(?i)\beasy money\b'
    - '(?i)\bpay(ment)? only (on|after|upon) (the )?final delivery\b'
    - '(?i)\bequipment (is )?provided\b'
    - '(?i)\brecruiter for\b.{0,60}\bsend (me )?your (cv|resume)\b'
    - '(?i)\bhelp in the next hour\b'
    - '(?i)\bdata access setup\b'
  injection_signals:
    - '(?i)ignore (all |any )?(previous|prior|above) (instructions|rules)'
    - '(?i)\b(system prompt|developer message|you are now|new instructions)\b'
    - '(?i)\b(include|add|insert) (the word|this phrase|the code)\b'
    - '(?i)\bas an ai\b'
